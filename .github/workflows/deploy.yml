name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Criar diretório de build
        run: |
          mkdir -p public/IHC
          mkdir -p public/ICG

          # Copiar os ficheiros do IHC
          cp -r 3y/2s/IHC/PraticAssigment2/Theme/* public/IHC/

          # Copiar os ficheiros do ICG
          cp -r 3y/2s/ICG/Proj/* public/ICG/

          echo "Contents of public directory:"
          ls -R public

      - name: Verificar se os diretórios estão vazios
        run: |
          if [ -z "$(ls -A public/IHC)" ]; then
            echo "Error: IHC directory is empty!"
            exit 1
          fi

          if [ -z "$(ls -A public/ICG)" ]; then
            echo "Error: ICG directory is empty!"
            exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload do artefato para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy para GitHub Pages
        uses: actions/deploy-pages@v4
