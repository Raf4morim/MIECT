name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Verificar diretório de origem
        run: |
          echo "Contents of source directory:"
          ls -R 3y/2s/IHC/PraticAssigment2/Theme/

      - name: Criar diretório de build
        run: |
          mkdir -p public
          cp -r 3y/2s/IHC/PraticAssigment2/Theme/* public/
          echo "Contents of public directory:"
          ls -R public

      - name: Verificar se o diretório public está vazio
        run: |
          if [ -z "$(ls -A public)" ]; then
            echo "Error: public directory is empty!"
            exit 1
          fi

      - name: Upload do artefato para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
          name: github-pages

      - name: Verificar artefato enviado
        run: |
          echo "Artefatos enviados:"
          ls -R public
          echo "Verificando se o artefato foi enviado..."
          if [ -z "$(ls -A public)" ]; then
            echo "Erro: O diretório public está vazio!"
            exit 1
          fi

